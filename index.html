<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPGA Flow Demo</title>
<!--
  Interactive "how an FPGA gets configured" graphic, 1280x720, for a reveal.js slide.
  All data comes from real tool runs baked into data.js by build.py.

  URL params:  ?step=0..3  &variant=majority|and3|xor3  &from=<variant>  &in=101  &theme=light  &controls=0
  Driving from a parent page:  iframe.contentWindow.postMessage({fpga: {step: 2}}, "*")
  When embedded, arrow/space/page keys are forwarded to the parent as {fpgaKey: key}.
  Keys: a / b / c toggle inputs, v cycles the design, ← → step (standalone only).
-->
<style>
  :root {
    --bg: #0c1016; --panel: #131a23; --panel-2: #0f151d; --edge: #232d3a;
    --text: #e8eef5; --muted: #8a97a8; --faint: #243041; --faint-2: #1a2330;
    --tile: #141c27; --tile-edge: #2a3647; --io: #17202c;
    --wire0: #4d86ff; --wire1: #ffb224; --lut: #2dd4bf; --lut-bg: rgba(45,212,191,.12);
    --sw-off: #2c394b; --code-kw: #ff7eb6; --code-fn: #82aaff; --code-str: #c3e88d; --code-cm: #5c6b7e;
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --edge: #d9dee5;
    --text: #17202b; --muted: #5b6878; --faint: #dde3ea; --faint-2: #eceff3;
    --tile: #f3f5f8; --tile-edge: #c5ced9; --io: #e9edf2;
    --wire0: #2f6bef; --wire1: #e08600; --lut: #0d9488; --lut-bg: rgba(13,148,136,.1);
    --sw-off: #c2ccd8; --code-kw: #c2185b; --code-fn: #1d4ed8; --code-str: #3f7a1a; --code-cm: #8a95a3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  .mono, code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px;
    transform-origin: 0 0; display: grid; grid-template-rows: 78px 1fr 76px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 20px; padding: 0 28px; border-bottom: 1px solid var(--edge); }
  .title { white-space: nowrap; line-height: 1.2; }
  .title b { display: block; font-size: 18px; }
  .title span { font-size: 12.5px; color: var(--muted); }
  .steps { display: flex; align-items: center; gap: 6px; flex: 1; }
  .step { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 10px; border: 1px solid transparent;
    display: flex; gap: 10px; align-items: center; transition: background .2s, border-color .2s; }
  .step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; border: 1.5px solid var(--muted); color: var(--muted); flex: none; }
  .step .t { font-size: 15px; font-weight: 650; line-height: 1.1; color: var(--muted); }
  .step .tool { display: block; font-size: 12px; font-weight: 500; color: var(--muted); opacity: .8; }
  .step.done .n { border-color: var(--lut); color: var(--lut); }
  .step.on { background: var(--panel); border-color: var(--edge); }
  .step.on .n { background: var(--lut); border-color: var(--lut); color: var(--bg); }
  .step.on .t { color: var(--text); }
  .arrow { color: var(--faint); font-size: 18px; }
  .seg { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .seg small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .seg div { display: flex; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 9px; padding: 3px; }
  .seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--lut); color: var(--bg); }

  /* ---------- main ---------- */
  main { display: grid; grid-template-columns: 450px 1fr; min-height: 0; }
  #left { padding: 18px 10px 14px 28px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .term { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; flex: 1;
    display: flex; flex-direction: column; min-height: 0; }
  .term .bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--edge);
    font-size: 12.5px; color: var(--muted); background: var(--panel-2); }
  .term .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); display: inline-block; }
  .term .bar .name { margin-left: 6px; }
  .term pre { margin: 0; padding: 14px 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow: hidden; flex: 1; }
  .kw { color: var(--code-kw); } .fn { color: var(--code-fn); } .cm { color: var(--code-cm); } .st { color: var(--code-str); }
  .term pre.small { font-size: 12.5px; line-height: 1.45; }
  .dim { color: var(--muted); } .hl-lut { color: var(--lut); font-weight: 700; } .hl-1 { color: var(--wire1); }
  .expr { background: var(--lut-bg); border-radius: 4px; box-shadow: 0 0 0 3px var(--lut-bg); }
  .flash { animation: flash .9s ease-out; }
  @keyframes flash { 0% { background: rgba(255,178,36,.45); box-shadow: 0 0 0 3px rgba(255,178,36,.45);} }
  .net-row { display: block; border-radius: 5px; padding: 1px 4px; margin: 0 -4px; cursor: default; }
  .net-row:hover, .net-row.hover { background: var(--faint-2); }
  .caption { font-size: 16px; line-height: 1.45; color: var(--text); min-height: 70px; padding: 0 4px; }
  .caption em { font-style: normal; color: var(--lut); font-weight: 650; }

  #right { position: relative; padding: 8px 18px 6px 8px; }
  svg#viz { width: 100%; height: 100%; display: block; overflow: visible; }
  svg text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  svg .muted { fill: var(--muted); }
  .scene { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  .scene.on { opacity: 1; pointer-events: auto; }
  .fade { transition: opacity .45s ease; }

  /* wires carrying a logic value */
  .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; }
  .w.v0 { stroke: var(--wire0); } .w.v1 { stroke: var(--wire1); filter: drop-shadow(0 0 4px rgba(255,178,36,.55)); }
  .gate { fill: var(--tile); stroke: var(--text); stroke-width: 2; }
  .gate-x { fill: none; stroke: var(--text); stroke-width: 2; }
  .cell { fill: var(--tile); stroke: var(--tile-edge); stroke-width: 1.5; transition: fill .25s, stroke .25s; }
  .cell.b1 { fill: var(--lut-bg); stroke: var(--lut); }
  .cell.sel { stroke: var(--wire1); stroke-width: 3; }
  .bitflip { animation: bitflip .9s ease-out; }
  @keyframes bitflip { 0% { fill: var(--wire1); } }

  /* fabric */
  .tile { fill: var(--tile); stroke: var(--tile-edge); stroke-width: 1.2; }
  .tile.io { fill: var(--io); stroke-dasharray: 3 3; }
  .lc { fill: none; stroke: var(--faint); stroke-width: 1; }
  .track { stroke: var(--faint); stroke-width: 1.5; }
  .sbox { fill: var(--bg); stroke: var(--sw-off); stroke-width: 1.3; }
  .pad { fill: var(--panel-2); stroke: var(--muted); stroke-width: 1.3; transition: fill .2s; }
  .pad.used { stroke: var(--text); stroke-width: 1.8; }
  .pad.v1 { fill: var(--wire1); }
  .sw { fill: var(--text); stroke: var(--bg); stroke-width: 1.5; }
  .lutbox { fill: var(--lut-bg); stroke: var(--lut); stroke-width: 2; }
  .route .w { stroke-width: 3.2; }
  .route.hover .w { stroke-width: 5.5; }
  .drawn .w.anim { animation: draw 1.1s ease-in-out both; }
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  .drawn .pop { animation: pop .35s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: scale(0); } }
  .pop { transform-box: fill-box; transform-origin: center; }
  .drop { transform-box: fill-box; transform-origin: center; }
  .drawn .drop { animation: drop .55s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes drop { from { opacity: 0; transform: scale(1.8); } }
  .pulse { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: .9; pointer-events: none; }
  .lutflash { animation: lutflash 1s ease-out; }
  @keyframes lutflash { 0% { fill: rgba(255,178,36,.6); } }
  .mbit { transition: fill .3s; }

  /* ---------- footer ---------- */
  footer { display: flex; align-items: center; gap: 22px; padding: 0 28px; border-top: 1px solid var(--edge); }
  footer .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .toggle { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; }
  .toggle .sw-track { width: 44px; height: 24px; border-radius: 12px; background: var(--faint); position: relative; transition: background .2s; }
  .toggle .sw-track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--text); transition: left .2s; }
  .toggle.v1 .sw-track { background: var(--wire1); } .toggle.v1 .sw-track::after { left: 23px; background: #fff; }
  .toggle .val { font-size: 14px; color: var(--muted); width: 10px; }
  .led { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .led i { width: 26px; height: 26px; border-radius: 50%; background: var(--faint); border: 2px solid var(--tile-edge); transition: all .2s; }
  .led.v1 i { background: var(--wire1); border-color: #ffe2a3; box-shadow: 0 0 18px 4px rgba(255,178,36,.6); }
  .into { color: var(--muted); font-size: 20px; }
  .nav { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .nav button { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
    border: 1px solid var(--edge); background: var(--panel); font-size: 16px; }
  .nav button:disabled { opacity: .3; cursor: default; }
  .keys { font-size: 12px; color: var(--muted); margin-right: 8px; }
  .keys kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--edge); border-radius: 4px; padding: 1px 5px; background: var(--panel); }
  body.nocontrols .nav, body.nocontrols .keys { display: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="title"><b>How an FPGA gets configured</b><span>real Amaranth · Yosys · nextpnr output</span></div>
    <nav class="steps" id="steps"></nav>
    <div class="seg"><small>design</small><div id="variants"></div></div>
  </header>
  <main>
    <section id="left">
      <div class="term"><div class="bar"><i></i><i></i><i></i><span class="name" id="termname"></span></div><pre id="term"></pre></div>
      <p class="caption" id="caption"></p>
    </section>
    <section id="right"><svg id="viz" viewBox="0 0 790 540"></svg></section>
  </main>
  <footer>
    <span class="lbl">inputs</span>
    <button class="toggle" data-in="a"><span>a</span><span class="sw-track"></span><span class="val">0</span></button>
    <button class="toggle" data-in="b"><span>b</span><span class="sw-track"></span><span class="val">0</span></button>
    <button class="toggle" data-in="c"><span>c</span><span class="sw-track"></span><span class="val">0</span></button>
    <span class="into">→</span>
    <span class="lbl">output</span>
    <span class="led" id="led"><i></i><span>y = <span id="yval">0</span></span></span>
    <div class="nav">
      <span class="keys"><kbd>a</kbd><kbd>b</kbd><kbd>c</kbd> inputs · <kbd>v</kbd> design</span>
      <button id="prev" aria-label="Previous step">◀</button><button id="next" aria-label="Next step">▶</button>
    </div>
  </footer>
</div>

<script src="data.js"></script>
<script>
"use strict";
const D = window.FPGA_DATA;
const $ = s => document.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
const fmt = n => n.toLocaleString("en-US");

const STEPS = [
  { title: "Describe", tool: "Amaranth HDL" },
  { title: "Synthesize", tool: "Yosys" },
  { title: "Place & Route", tool: "nextpnr" },
  { title: "Configure", tool: "bitstream" },
];
const VARIANTS = { majority: "Majority", and3: "AND3", xor3: "XOR3" };
const CLASSNAME = { majority: "Majority", and3: "And3", xor3: "Xor3" };
const INPUTS = ["a", "b", "c"];

const params = new URLSearchParams(location.search);
if (params.get("theme") === "light") document.documentElement.dataset.theme = "light";
if (params.get("controls") === "0") document.body.classList.add("nocontrols");
const state = {
  step: Math.max(0, Math.min(3, +params.get("step") || 0)),
  variant: VARIANTS[params.get("variant")] ? params.get("variant") : "majority",
  prev: null,
  ins: { a: 0, b: 0, c: 0 },
};
if (VARIANTS[params.get("from")]) state.prev = params.get("from");   // show a diff on load
(params.get("in") || "").split("").slice(0, 3).forEach((ch, i) => state.ins[INPUTS[i]] = +(ch === "1"));
const V = () => D.variants[state.variant];

/* ---------- logic ---------- */
// The LUT's inputs are whatever pins nextpnr chose (e.g. I1=a, I2=c, I3=b); I0 is unused.
const usedPins = v => Object.keys(v.lut_pins).sort().reverse();          // ["I3","I2","I1"]
function lutIndex(v, ins) {
  let idx = 0;
  for (const [pin, sig] of Object.entries(v.lut_pins)) idx |= (ins[sig] ? 1 : 0) << +pin.slice(1);
  return idx;
}
const lutOut = (v, ins) => +v.lut_init[v.lut_init.length - 1 - lutIndex(v, ins)];
function rowInputs(v, k) {                     // k-th row of the LUT memory, in LUT pin order
  const pins = usedPins(v), ins = {};
  pins.forEach((p, j) => ins[v.lut_pins[p]] = (k >> (pins.length - 1 - j)) & 1);
  return ins;
}
const rowOf = (v, ins) => usedPins(v).reduce((k, p) => (k << 1) | ins[v.lut_pins[p]], 0);
function evalGates(v, ins) {
  const val = {};
  for (const [bit, name] of Object.entries(v.gates.names)) if (name in ins) val[bit] = ins[name];
  let pending = [...v.gates.gates];
  for (let guard = 0; pending.length && guard < 64; guard++) {
    pending = pending.filter(g => {
      if (!g.in.every(i => i in val)) return true;
      const [x, y] = g.in.map(i => val[i]);
      val[g.out] = { AND: x & y, OR: x | y, XOR: x ^ y, NOT: 1 - x, NAND: 1 - (x & y), NOR: 1 - (x | y) }[g.kind] ?? 0;
      return false;
    });
  }
  return val;
}
const bitOf = (v, name) => +Object.keys(v.gates.names).find(k => v.gates.names[k] === name);

/* ---------- header ---------- */
STEPS.forEach((s, i) => {
  if (i) $("#steps").insertAdjacentHTML("beforeend", `<span class="arrow">→</span>`);
  $("#steps").insertAdjacentHTML("beforeend",
    `<button class="step" data-step="${i}"><span class="n">${i + 1}</span><span class="t">${s.title}<span class="tool">${s.tool}</span></span></button>`);
});
for (const [k, label] of Object.entries(VARIANTS))
  $("#variants").insertAdjacentHTML("beforeend", `<button data-variant="${k}">${label}</button>`);
document.querySelectorAll(".step").forEach(b => b.onclick = () => setStep(+b.dataset.step));
document.querySelectorAll("[data-variant]").forEach(b => b.onclick = () => setVariant(b.dataset.variant));
document.querySelectorAll(".toggle").forEach(b => b.onclick = () => toggleInput(b.dataset.in));
$("#prev").onclick = () => setStep(state.step - 1);
$("#next").onclick = () => setStep(state.step + 1);

/* ---------- left panel (terminal) ---------- */
function codeFor(variant) {
  const src = D.variants[variant].source.replace(/self\.(\w)/g, `<span class="kw">self</span>.$1`);
  const lines = src.split(" | ");
  const body = lines.length > 1
    ? `        m.d.comb += <span class="kw">self</span>.y.eq(\n<span class="expr" id="expr">` +
      lines.map((l, i) => `            ${l}${i < lines.length - 1 ? " |" : ")"}`).join("\n") + `</span>`
    : `        m.d.comb += <span class="kw">self</span>.y.eq(\n<span class="expr" id="expr">            ${src})</span>`;
  return `<span class="kw">from</span> amaranth <span class="kw">import</span> *

<span class="kw">class</span> <span class="fn">${CLASSNAME[variant]}</span>(Elaboratable):
    <span class="kw">def</span> <span class="fn">__init__</span>(<span class="kw">self</span>):
        <span class="kw">self</span>.a = Signal()   <span class="cm"># 1-bit inputs</span>
        <span class="kw">self</span>.b = Signal()
        <span class="kw">self</span>.c = Signal()
        <span class="kw">self</span>.y = Signal()   <span class="cm"># 1-bit output</span>

    <span class="kw">def</span> <span class="fn">elaborate</span>(<span class="kw">self</span>, platform):
        m = Module()
        <span class="cm"># comb: no clock, no memory</span>
${body}
        <span class="kw">return</span> m`;
}
function gateCounts(v) {
  const n = {};
  v.gates.gates.forEach(g => n[g.kind] = (n[g.kind] || 0) + 1);
  return Object.entries(n).map(([k, c]) => `${k} ×${c}`).join("   ");
}
const routingSwitches = v => Object.values(v.nets).reduce((n, x) => n + x.pips.filter(p => !p.endsWith("_lut")).length, 0);
const shortWire = w => w.split("/").slice(2).join("/");
function termFor(step) {
  const v = V();
  if (step === 0) return [`${state.variant}.py`, codeFor(state.variant)];
  if (step === 1) {
    const cells = v.yosys_cells.map(c => `${c.type} ×${c.count}`).join("  ");
    return ["yosys", `<span class="dim">$</span> yosys -p <span class="st">"synth_ice40 -top top"</span>

<span class="dim">1. read the design, make generic gates</span>
     ${gateCounts(v)}

<span class="dim">2. map onto what the iCE40 actually has</span>
     <span class="hl-lut">${cells}</span>   <span class="dim">(4-input lookup table)</span>

<span class="dim">3. fill in the LUT's memory (its truth table)</span>
     LUT_INIT = 16'b<span class="hl-lut" id="lutinit">${v.lut_init}</span>`];
  }
  if (step === 2) {
    const tileOf = s => Object.keys(v.placement).find(b => v.placement[b].signal === s).split("/").slice(0, 2).join("/");
    const place = [`  <span class="hl-lut">LUT</span> → tile ${D.lut_bel.replace(/\/lc(\d)/, ", cell $1")}`]
      .concat([["a", "b"], ["c", "y"]].map(pair => "  " + pair.map(s => `${s} → pin ${D.pins[s]} (${tileOf(s)})`).join("   ")));
    const routes = INPUTS.concat("y").map(s => {
      const wires = v.nets[s].wires.filter(w => !w.endsWith("_lut")).map(shortWire);
      return `<span class="net-row" data-net="${s}"><b>${s}</b> ${wires.join(" → ")}</span>`;
    }).join("");
    return ["nextpnr-ice40", `<span class="dim">$</span> nextpnr-ice40 --hx1k --pcf pins.pcf

<span class="dim">placed:</span>
${place.join("\n")}

<span class="dim">routed (${routingSwitches(v)} switches turned on):</span>
${routes}`];
  }
  const bd = D.bitstream_diff, ones = v.ones_on_chip;
  let change = `<span class="dim">switch the design (buttons, top right) and\nwatch which bits change →</span>`;
  if (state.prev && state.prev !== state.variant) {
    const flipped = bd.differing.filter(d => d[state.prev] !== d[state.variant]);
    const tiles = [...new Set(flipped.map(d => d.tile.split(" ")[1]))];
    change = `<span class="dim">${VARIANTS[state.prev]} → ${VARIANTS[state.variant]}:</span>
  bits flipped:     <span class="hl-1">${flipped.length}</span> of ${fmt(bd.total_bits)}
  where:            tile ${tiles.join(", ") || "—"}, <span class="hl-lut">the LUT</span>
  routing changed:  <span class="hl-lut">nothing</span>`;
  }
  return ["icepack", `<span class="dim">$</span> icepack top.asc top.bin
  ${fmt(v.bitstream_bytes)} bytes = ${fmt(bd.total_bits)} config bits
  set to 1:  ${fmt(ones)}  <span class="dim">(${(100 * ones / bd.total_bits).toFixed(2)}%)</span>

<span class="dim">every LUT and every switch on the chip
is one of these bits.</span>

${change}`];
}
const CAPTIONS = [
  () => `You describe <em>behavior</em>: ${ {
      majority: "y is 1 when at least two inputs are 1",
      and3: "y is 1 only when all three inputs are 1",
      xor3: "y is 1 when an odd number of inputs are 1" }[state.variant]}. Nothing here says which wires or chips to use.`,
  () => `Yosys turns the code into logic gates, then notices the whole thing fits in <em>one lookup table (LUT)</em>: a tiny memory that stores the truth table. The inputs just pick a row.`,
  () => `nextpnr picks one of the chip's 1,280 LUTs and <em>turns on ${routingSwitches(V())} switches</em> to connect it to the pins. The wires were always there; nothing else is used.`,
  () => `The bitstream sets every LUT and switch. Changing the design <em>only rewrites bits</em>: here, the same LUT gets new contents while the wiring stays put. No new hardware.`,
];
function renderLeft(flash) {
  const [name, html] = termFor(state.step);
  $("#termname").textContent = name;
  $("#term").innerHTML = html;
  $("#term").classList.toggle("small", state.step === 2);
  $("#caption").innerHTML = CAPTIONS[state.step]();

/* Scene 1: gates → LUT (memory + selector) */
function gateShape(g, kind, x, cy) {
  const t = cy - 22;
  if (kind === "AND") {
    el("path", { d: `M${x},${t} h26 a22,22 0 0 1 0,44 h-26 z`, class: "gate" }, g);
    return { in: [[x, t + 12], [x, t + 32]], out: [x + 48, cy] };
  }
  const or = `M${x},${t} q14,22 0,44 q38,0 56,-22 q-18,-22 -56,-22 z`;
  el("path", { d: or, class: "gate" }, g);
  if (kind === "XOR") el("path", { d: `M${x - 8},${t} q14,22 0,44`, class: "gate-x" }, g);
  return { in: [[x + 7, t + 12], [x + 7, t + 32]], out: [x + 56, cy] };
}
function buildScene1() {
  const g = scenes[1], v = V();
  g.innerHTML = "";
  el("text", { x: 200, y: 36, "text-anchor": "middle", class: "muted", "font-size": 14, text: "1 · as logic gates" }, g);

  // levelize the real Yosys gate netlist
  const lvl = {}, pos = {};
  INPUTS.forEach((s, i) => { const b = bitOf(v, s); lvl[b] = 0; pos[b] = [52, 130 + i * 130]; });
  const gs = v.gates.gates.map(x => ({ ...x }));
  for (let changed = true; changed;) {
    changed = false;
    for (const x of gs) if (!(x.out in lvl) && x.in.every(i => i in lvl)) { lvl[x.out] = 1 + Math.max(...x.in.map(i => lvl[i])); changed = true; }
  }
  const maxL = Math.max(...gs.map(x => lvl[x.out]));
  const colW = 290 / maxL;
  for (let L = 1; L <= maxL; L++) {
    const here = gs.filter(x => lvl[x.out] === L);
    here.forEach(x => x.cy = x.in.reduce((s, i) => s + pos[i][1], 0) / x.in.length);
    here.sort((p, q) => p.cy - q.cy);
    for (let i = 1; i < here.length; i++) here[i].cy = Math.max(here[i].cy, here[i - 1].cy + 80);
    here.forEach(x => {
      x.x = 80 + (L - 1) * colW + (colW - 56) / 2;
      const shape = gateShape(el("g", {}, g), x.kind, x.x, x.cy);
      x.pins = shape.in; pos[x.out] = shape.out;
    });
  }
  const wires = el("g", {}, g);
  g.insertBefore(wires, g.children[1]);
  const val = () => evalGates(V(), state.ins);
  for (const x of gs) x.in.forEach((src, j) => {
    const [sx, sy] = pos[src], [tx, ty] = x.pins[j], mx = sx + Math.max(18, (tx - sx) * .5);
    bindWire(el("path", { d: `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`, class: "w" }, wires), () => val()[src]);
  });
  const yb = bitOf(v, "y"), [ox, oy] = pos[yb];
  bindWire(el("path", { d: `M${ox},${oy} H385`, class: "w" }, wires), () => val()[yb]);
  el("text", { x: 392, y: oy + 6, "font-size": 18, "font-weight": 700, text: "y" }, g);
  INPUTS.forEach(s => {
    const [x, y] = pos[bitOf(v, s)];
    el("text", { x: x - 12, y: y + 6, "text-anchor": "end", "font-size": 18, "font-weight": 700, text: s }, g);

  });

  // arrow
  el("path", { d: "M410,250 H452 m-9,-7 l9,7 l-9,7", fill: "none", stroke: "var(--lut)", "stroke-width": 2.5 }, g);
  el("text", { x: 432, y: 236, "text-anchor": "middle", "font-size": 12, fill: "var(--lut)", text: "fits in" }, g);

  // the LUT: 8 memory cells + selector (mux)
  el("text", { x: 620, y: 36, "text-anchor": "middle", class: "muted", "font-size": 14, text: "2 · as one lookup table (LUT)" }, g);
  const pins = usedPins(v), sigs = pins.map(p => v.lut_pins[p]);
  const cx = 560, top = 62, ch = 38, gap = 4;
  el("rect", { x: 470, y: top - 14, width: 280, height: 8 * (ch + gap) + 22, rx: 14, class: "lutbox", "stroke-dasharray": "5 4" }, g);
  el("text", { x: 506, y: top + 2, "text-anchor": "middle", class: "m muted", "font-size": 13, text: sigs.join(" ") }, g);
  el("text", { x: 579, y: top + 2, "text-anchor": "middle", class: "muted", "font-size": 12, text: "memory" }, g);
  const muxL = 628, muxR = 680, muxTop = top + 10, muxBot = top + 8 * (ch + gap), outY = (muxTop + muxBot) / 2;
  for (let k = 0; k < 8; k++) {

    el("text", { x: 506, y: y + ch / 2 + 6, "text-anchor": "middle", class: "m muted", "font-size": 15,

    const ty = muxTop + 16 + k * ((muxBot - muxTop - 32) / 7);

      () => (rowOf(V(), state.ins) === k ? 2 : 3));

  el("text", { x: 652, y: outY + 5, "text-anchor": "middle", "font-size": 12, class: "muted", transform: `rotate(-90 652 ${outY})`, text: "select" }, g);
  sigs.forEach((s, j) => {
    const x = muxL + 12 + j * 14, yTop = muxBot - 60 + ((x - muxL) / (muxR - muxL)) * 60 + 4;
    bindWire(el("path", { d: `M${x},${yTop} V${muxBot + 34}`, class: "w", "stroke-width": 2 }, g), () => state.ins[s]);
    el("text", { x, y: muxBot + 52, "text-anchor": "middle", "font-size": 14, "font-weight": 700, text: s }, g);
  });
  bindWire(el("path", { d: `M${muxR},${outY} H730`, class: "w" }, g), () => lutOut(V(), state.ins));
  el("text", { x: 738, y: outY + 6, "font-size": 18, "font-weight": 700, text: "y" }, g);

    text: `(Real iCE40 LUTs have 4 inputs = 16 bits; input I0 is unused here.)` }, g);

/* Scene 2/3: the FPGA fabric (a real 5×5-tile corner of the iCE40 HX1K) */
const T = 92, OX = 58, OY = 22, G = 13, N = 5, TRK = [-8, 0, 8];
const tileBox = (x, y) => { const l = OX + x * T, t = OY + (N - 1 - y) * T; return { l: l + G, t: t + G, r: l + T - G, b: t + T - G }; };
const vChan = x => OX + (x + 1) * T;     // channel just right of column x
const hChan = y => OY + (N - 1 - y) * T; // channel just above row y
const parseBel = b => { const m = b.match(/X(\d+)\/Y(\d+)(?:\/(\w+))?/); return { x: +m[1], y: +m[2], site: m[3] }; };
let routes = {};
function padPos(bel) {
  const { x, y, site } = parseBel(bel), box = tileBox(x, y), io = +site.slice(2);
  if (x === 0) return { x: box.r - 13, y: io ? box.t + 16 : box.b - 16, side: "left" };
  return { x: io ? box.r - 16 : box.l + 16, y: box.t + 13, side: "bottom" };
}
function buildFabric() {
  const g = scenes[2], v = V();
  g.innerHTML = "";
  const base = el("g", { class: "fabric-base" }, g);
  // channels: every tile boundary carries tracks, most of them unused
  for (let i = 1; i < N; i++) for (const o of TRK) {
    el("line", { x1: OX + T * .15, x2: OX + N * T, y1: hChan(i - 1 + 0) + o, y2: hChan(i - 1) + o, class: "track" }, base);
    el("line", { y1: OY, y2: OY + N * T - T * .15, x1: vChan(i - 1) + o, x2: vChan(i - 1) + o, class: "track" }, base);
  }
  // tiles
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    if (!x && !y) continue;
    const b = tileBox(x, y), io = !x || !y;
    el("rect", { x: b.l, y: b.t, width: b.r - b.l, height: b.b - b.t, rx: 7, class: "tile" + (io ? " io" : "") }, base);
    if (io) {
      [0, 1].forEach(k => {
        const p = padPos(`X${x}/Y${y}/io${k}`);
        el("rect", { x: p.x - 5, y: p.y - 5, width: 10, height: 10, rx: 2, class: "pad", id: `pad-${x}-${y}-${k}` }, base);
      });
    } else if (!(x === parseBel(D.lut_bel).x && y === parseBel(D.lut_bel).y)) {
      for (let k = 0; k < 8; k++)
        el("rect", { x: b.l + 9 + (k % 2) * 25, y: b.t + 8 + Math.floor(k / 2) * 13, width: 21, height: 9, rx: 2, class: "lc" }, base);
    }
  }
  // switch boxes at every channel crossing
  for (let i = 0; i < N - 1; i++) for (let j = 0; j < N - 1; j++)
    el("rect", { x: vChan(i) - 7, y: hChan(j) - 7, width: 14, height: 14, rx: 3, class: "sbox", transform: `rotate(45 ${vChan(i)} ${hChan(j)})` }, base);
  // labels
  for (let x = 0; x < N; x++) el("text", { x: OX + x * T + T / 2, y: OY - 6, "text-anchor": "middle", class: "m muted", "font-size": 11, text: "X" + x }, base);
  for (let y = 0; y < N; y++) el("text", { x: OX + N * T + 6, y: OY + (N - 1 - y) * T + T / 2 + 4, class: "m muted", "font-size": 11, text: "Y" + y }, base);

  // the LUT that nextpnr placed
  const lp = parseBel(D.lut_bel), lb = tileBox(lp.x, lp.y);
  const lut = { l: lb.l + 30, r: lb.r - 5, t: lb.t + 7, b: lb.b - 7 };
  const lutG = el("g", { class: "drop" }, g);
  el("rect", { x: lut.l, y: lut.t, width: lut.r - lut.l, height: lut.b - lut.t, rx: 5, class: "lutbox", id: "fablut" }, lutG);
  el("text", { x: (lut.l + lut.r) / 2, y: (lut.t + lut.b) / 2 + 5, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "var(--lut)", text: "LUT" }, lutG);
  el("text", { x: lb.l + 2, y: lb.b + 11, "font-size": 10, class: "m", fill: "var(--lut)", text: D.lut_bel.replace(/\/lc\d/, "") }, lutG);
  const pinY = k => lut.t + 8 + k * 10;                      // I0..I3 top to bottom
  for (let k = 0; k < 4; k++) el("line", { x1: lut.l - 3, x2: lut.l, y1: pinY(k), y2: pinY(k), stroke: "var(--lut)", "stroke-width": 1.5 }, lutG);

  // routes: real nets, drawn on the channel tracks they occupy
  routes = {};
  const routeG = el("g", {}, g);
  const pinOf = s => +Object.keys(v.lut_pins).find(p => v.lut_pins[p] === s).slice(1);
  const hy = hChan(lp.y);                                    // channel above the LUT's row
  const inputs = INPUTS.map(s => ({ s, p: padPos(Object.keys(v.placement).find(b => v.placement[b].signal === s)) }))
    .sort((m, n) => m.p.y - n.p.y);                         // top pad takes the top track
  const muxX = [lb.l + 20, lb.l + 11, lb.l + 2];             // topmost track turns down last
  inputs.forEach(({ s, p }, i) => {
    const o = TRK[i], vx = vChan(0) + o, ty = hy + o, mx = muxX[i], py = pinY(pinOf(s));
    const pts = [[p.x + 5, p.y], [vx, p.y], [vx, ty], [mx, ty], [mx, py], [lut.l - 3, py]];
    // one dot per real routing switch: pad→long wire, (vertical→horizontal), →local mux, →LUT pin
    const nsw = v.nets[s].pips.filter(q => !q.endsWith("_lut")).length;
    const sw = nsw > 3 ? [[vx, p.y], [vx, ty], [mx, ty], [lut.l - 3, py]] : [[vx, p.y], [mx, ty], [lut.l - 3, py]];
    routes[s] = { pts, sw, get: () => state.ins[s], pad: p };
  });
  const yp = padPos(Object.keys(v.placement).find(b => v.placement[b].signal === "y"));
  const outY = (lut.t + lut.b) / 2, vx = vChan(lp.x), iy = yp.y - 12;
  routes.y = { pts: [[lut.r, outY], [vx, outY], [vx, iy], [yp.x, iy], [yp.x, yp.y - 5]],
    sw: [[vx, outY], [vx, iy], [yp.x, yp.y - 5]], get: () => lutOut(V(), state.ins), pad: yp };
  let delay = 0;
  for (const [s, r] of Object.entries(routes)) {
    const rg = el("g", { class: "route", "data-net": s }, routeG);
    const d = "M" + r.pts.map(p => p.join(",")).join(" L");
    const path = bindWire(el("path", { d, class: "w anim", style: `animation-delay:${delay}s` }, rg), r.get);
    r.path = path; r.g = rg;
    r.sw.forEach((q, i) => el("circle", { cx: q[0], cy: q[1], r: 4.6, class: "sw pop", style: `animation-delay:${delay + .9 + i * .08}s` }, rg));
    rg.onmouseenter = () => hoverNet(s, true); rg.onmouseleave = () => hoverNet(s, false);
    delay += .35;
    // pin labels outside the chip edge
    const p = r.pad;
    if (p.side === "left") {
      el("line", { x1: OX - 4, x2: p.x - 5, y1: p.y, y2: p.y, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "2 3" }, base);
      el("text", { x: OX - 8, y: p.y - 1, "text-anchor": "end", "font-size": 17, "font-weight": 700, text: s }, g);
      el("text", { x: OX - 8, y: p.y + 12, "text-anchor": "end", "font-size": 10, class: "m muted", text: "pin " + D.pins[s] }, g);
    } else {
      el("line", { x1: p.x, x2: p.x, y1: p.y + 5, y2: OY + N * T + 6, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "2 3" }, base);
      el("text", { x: p.x, y: OY + N * T + 26, "text-anchor": "middle", "font-size": 17, "font-weight": 700, text: s }, g);
      el("text", { x: p.x, y: OY + N * T + 40, "text-anchor": "middle", "font-size": 10, class: "m muted", text: "pin " + D.pins[s] + " → LED" }, g);
    }
    const [bx, by] = [p.x, p.y];
    const k = [...document.querySelectorAll(".pad")].find(e => {
      const x = +e.getAttribute("x") + 5, y = +e.getAttribute("y") + 5; return Math.abs(x - bx) < 1 && Math.abs(y - by) < 1;
    });
    if (k) { k.classList.add("used"); r.padEl = k; }
  }
  requestAnimationFrame(() => Object.values(routes).forEach(r => {
    const len = r.path.getTotalLength();
    r.path.style.setProperty("--len", len); r.path.style.strokeDasharray = len;
  }));

  buildSidePanels(g, lb);
}

/* right-hand panels: legend (step 3) and the tile's real config bits (step 4) */

  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    el("rect", { x: mx + c * cw, y: my + r * ch, width: cw - 1, height: ch - 1.2, class: "mbit", id: `mb-${r}-${c}`,
      "data-lut": +(LUT_R.includes(r) && c >= LUT_C[0] && c <= LUT_C[1]) }, bits);
  el("rect", { x: mx + LUT_C[0] * cw - 2, y: my - 2, width: (LUT_C[1] - LUT_C[0] + 1) * cw + 3, height: 2 * ch + 3, rx: 2,
    fill: "none", stroke: "var(--lut)", "stroke-width": 1.6 }, bits);
  el("path", { d: `M${mx + 40 * cw},${my + 2 * ch + 2} V${my + rows * ch + 26}`, stroke: "var(--lut)", "stroke-width": 1.2 }, bits);
  el("text", { x: mx + 40 * cw, y: my + rows * ch + 40, "text-anchor": "middle", "font-size": 12, fill: "var(--lut)", text: "LUT memory" }, bits);
  const ly = my + rows * ch + 62;
  [["var(--lut)", "1: LUT memory bit"], ["var(--text)", "1: switch on / cell setting"], ["var(--faint)", "0: off"]].forEach(([c, t], i) => {
    el("rect", { x: X, y: ly + i * 20 - 9, width: 10, height: 10, rx: 2, fill: c }, bits);
    el("text", { x: X + 18, y: ly + i * 20, "font-size": 12.5, text: t }, bits);
  });
  // leader line from the tile on the grid to the bit panel
  el("path", { d: `M${lb.r + 2},${lb.t + 6} C${lb.r + 90},${lb.t - 40} ${X - 80},${my + 40} ${X - 8},${my + 40}`, fill: "none",
    stroke: "var(--lut)", "stroke-width": 1.4, "stroke-dasharray": "4 4" }, bits);

  // LUT memory as a strip of 8 cells
  const sy = ly + 78;
  el("text", { x: X, y: sy, "font-size": 13, class: "muted", text: "LUT memory, rows " + usedPins(v).map(p => v.lut_pins[p]).join(" ") + " = 000 … 111" }, bits);
  for (let k = 0; k < 8; k++) {
    el("rect", { x: X + k * 29, y: sy + 10, width: 25, height: 28, rx: 5, class: "cell", id: "sc" + k }, bits);
    el("text", { x: X + k * 29 + 12.5, y: sy + 30, "text-anchor": "middle", class: "m", "font-size": 15, "font-weight": 700, id: "st" + k }, bits);
  }
}
function hoverNet(s, on) {
  document.querySelectorAll(`.route[data-net="${s}"], .net-row[data-net="${s}"]`).forEach(e => e.classList.toggle("hover", on));
}

/* ---------- updates ---------- */
function paintBits(flipFrom) {
  const v = V();
  v.lut_tile_bits.forEach((row, r) => [...row].forEach((b, c) => {
    const e = document.getElementById(`mb-${r}-${c}`);
    if (!e) return;
    e.setAttribute("fill", b === "1" ? (e.dataset.lut === "1" ? "var(--lut)" : "var(--text)") : "var(--faint)");
    if (flipFrom && flipFrom.lut_tile_bits[r][c] !== b) { e.classList.remove("bitflip"); void e.getBBox(); e.classList.add("bitflip"); }
  }));
  for (let k = 0; k < 8; k++) {
    const bit = lutOut(v, rowInputs(v, k)), c = document.getElementById("sc" + k), t = document.getElementById("st" + k);
    if (!c) continue;
    c.setAttribute("class", `cell b${bit}` + (rowOf(v, state.ins) === k ? " sel" : ""));
    t.textContent = bit; t.setAttribute("fill", bit ? "var(--lut)" : "var(--muted)");
    if (flipFrom && lutOut(flipFrom, rowInputs(flipFrom, k)) !== bit) { c.classList.add("bitflip"); }
  }
}
function update() {
  const v = V(), y = lutOut(v, state.ins);
  for (const { e, get } of wireRefs) {
    const val = get();
    if (val === 2 || val === 3) {         // LUT row → selector wires: highlight only the selected row
      e.setAttribute("class", "w " + (val === 2 ? (y ? "v1" : "v0") : ""));
      e.style.stroke = val === 3 ? "var(--faint)" : "";
    } else e.setAttribute("class", e.getAttribute("class").replace(/\bv[01]\b/g, "").trim() + " v" + (val ? 1 : 0));
  }
  document.querySelectorAll(".toggle").forEach(b => {
    b.classList.toggle("v1", !!state.ins[b.dataset.in]);
    b.querySelector(".val").textContent = state.ins[b.dataset.in];
  });
  $("#led").classList.toggle("v1", !!y);
  $("#yval").textContent = y;
  const k0 = state.ins.a * 4 + state.ins.b * 2 + state.ins.c;
  document.querySelectorAll("#ttrows > g").forEach(r => r.querySelector("rect").setAttribute("fill", +r.dataset.k === k0 ? "var(--lut-bg)" : "transparent"));
  document.querySelectorAll("#ttrows > g").forEach(r => r.querySelector("rect").setAttribute("stroke", +r.dataset.k === k0 ? "var(--lut)" : "none"));
  const sel = rowOf(v, state.ins);
  for (let k = 0; k < 8; k++) { const c = document.getElementById("lc" + k); if (c) c.classList.toggle("sel", k === sel); }
  for (const r of Object.values(routes)) if (r.padEl) r.padEl.classList.toggle("v1", !!r.get());
  paintBits();
}
function pulse(nets) {
  if (state.step < 2) return;
  nets.forEach((s, i) => {
    const r = routes[s]; if (!r) return;
    const len = r.path.getTotalLength();
    const p = el("path", { d: r.path.getAttribute("d"), class: "pulse", "stroke-dasharray": `10 ${len + 20}`, "stroke-dashoffset": 10 }, r.g);
    p.animate([{ strokeDashoffset: 10 }, { strokeDashoffset: -len }], { duration: 650, delay: i * 500, easing: "ease-in-out" }).onfinish = () => p.remove();
  });
}
function toggleInput(s) {
  state.ins[s] ^= 1;
  update();
  pulse([s, "y"]);
}
function rebuild() {
  wireRefs.length = 0;
  buildScene0(); buildScene1(); buildFabric();
}
function setVariant(name) {
  if (!VARIANTS[name] || name === state.variant) return;
  const from = V();
  state.prev = state.variant; state.variant = name;
  document.querySelectorAll("[data-variant]").forEach(b => b.classList.toggle("on", b.dataset.variant === name));
  rebuild();
  showScene(false);
  update();
  paintBits(from);
  const lut = $("#fablut"); if (lut) { lut.classList.remove("lutflash"); void lut.getBBox(); lut.classList.add("lutflash"); }
  for (let k = 0; k < 8; k++) if (lutOut(from, rowInputs(from, k)) !== lutOut(V(), rowInputs(V(), k))) {
    const c = document.getElementById("lc" + k); if (c) c.classList.add("bitflip");
  }
  renderLeft(true);
}
function showScene(animate) {
  const s = state.step, sceneIdx = Math.min(s, 2);
  scenes.forEach((g, i) => g.classList.toggle("on", i === sceneIdx));
  $("#legend").style.opacity = s === 2 ? 1 : 0;
  $("#bits").style.opacity = s === 3 ? 1 : 0;
  scenes[2].querySelectorAll(".route").forEach(r => r.style.opacity = 1);
  if (animate && s === 2) { scenes[2].classList.remove("drawn"); void scenes[2].getBBox(); scenes[2].classList.add("drawn"); }
}
function setStep(n) {
  n = Math.max(0, Math.min(STEPS.length - 1, n));
  const entering = n !== state.step;
  const cameFromBefore = n === 2 && state.step < 2;
  state.step = n;
  document.querySelectorAll(".step").forEach((b, i) => { b.classList.toggle("on", i === n); b.classList.toggle("done", i < n); });
  $("#prev").disabled = n === 0; $("#next").disabled = n === STEPS.length - 1;
  showScene(cameFromBefore || (entering && n === 2) || !entering);
  renderLeft(false);
}

/* ---------- keyboard + embedding ---------- */
const embedded = window.parent !== window;
const NAV_KEYS = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown", " ", "PageUp", "PageDown"];
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (INPUTS.includes(k.toLowerCase())) return toggleInput(k.toLowerCase());
  if (k === "v") { const ks = Object.keys(VARIANTS); return setVariant(ks[(ks.indexOf(state.variant) + 1) % ks.length]); }
  if (!NAV_KEYS.includes(k)) return;
  e.preventDefault();
  if (embedded) return window.parent.postMessage({ fpgaKey: k }, "*");   // let the slide deck drive
  if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(k)) setStep(state.step + 1); else setStep(state.step - 1);
});
window.addEventListener("message", e => {
  const m = e.data && e.data.fpga;
  if (!m) return;
  if (m.variant) setVariant(m.variant);
  if (m.inputs) { Object.assign(state.ins, m.inputs); update(); }
  if (typeof m.step === "number") setStep(m.step);
});

/* ---------- fit 1280×720 into any window ---------- */
function fit() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  $("#stage").style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener("resize", fit); fit();

document.querySelectorAll("[data-variant]").forEach(b => b.classList.toggle("on", b.dataset.variant === state.variant));
rebuild();
const s0 = state.step; state.step = -1; setStep(s0);
update();
</script>
